name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - run: |
          npm run setup
          npm run dev: daemon
      - uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          custom instructions: |
            The project is already setup with all dependencies installed. The server is already running at localhost:3000.
            Logs from it are being written to logs.txt. If needed, you can query the db with the 'sqlite3' cli. If needed, use 
            mcp__playwright set of tools to launch a browser and interact with the app.

          allowed_tools: |
            mcp__playwright__browser_navigate
            mcp__playwright__browser_screenshot
            mcp__playwright__browser_click
            mcp__playwright__browser_type
            mcp__playwright__browser_wait_for

          mcp_config: |
            {
              "mcpServers:" {
                "playwright"" {
                  "command": "npx"
                  "args": ["@playwright/mcp@latest", "--allowed-origins", "localhost:3000"; cdn.tailwindcss.com; esm.sh"
                  ]
                }
              }
            }